name: Build Kernel (Boot.img)

on:
  workflow_dispatch:

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-22.04
    steps:
      - name: Build
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/Vikram5fbd009/Overclock_mt6833
          kernel-branch: backport-path_umount 
          config: camellia_defconfig
          arch: arm64
          android-version: 12
          aosp-clang-version: r383902
          
          anykernel3: false 
          
          # 👇 यहाँ अपना कॉपी किया हुआ डायरेक्ट लिंक पेस्ट करें
          bootimg-url: "https://github.com/cristidclxvi/android_device_xiaomi_camellia/releases/download/23.2-20260901/boot.img"
          
          ksu: false
