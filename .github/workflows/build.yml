name: Build Kernel (Camellia)

on:
  workflow_dispatch:

jobs:
  build-kernel:
    name: Build Camellia (MT6833)
    runs-on: ubuntu-22.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v4

      - name: ⌛️ Set Swap Space (16GB)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: ⚙️ Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git ccache automake flex lzop bison gperf \
          build-essential zip curl zlib1g-dev libxml2-utils bzip2 libbz2-dev \
          squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool make optipng \
          maven libssl-dev pwgen minicom bc libx11-dev libgl1-mesa-dev xsltproc \
          unzip device-tree-compiler python3 binutils-aarch64-linux-gnu

      - name: ☁️ Download Toolchain (Clang r383902 & GCC)
        run: |
          mkdir -p $GITHUB_WORKSPACE/toolchain/clang
          wget -q "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android11-release/clang-r383902.tar.gz" -O clang.tar.gz
          tar -C $GITHUB_WORKSPACE/toolchain/clang -zxf clang.tar.gz
          rm clang.tar.gz

          mkdir -p $GITHUB_WORKSPACE/toolchain/gcc-64
          wget -q "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz" -O gcc64.tar.gz
          tar -C $GITHUB_WORKSPACE/toolchain/gcc-64 -zxf gcc64.tar.gz
          rm gcc64.tar.gz

          mkdir -p $GITHUB_WORKSPACE/toolchain/gcc-32
          wget -q "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz" -O gcc32.tar.gz
          tar -C $GITHUB_WORKSPACE/toolchain/gcc-32 -zxf gcc32.tar.gz
          rm gcc32.tar.gz

          echo "✅ Toolchain Downloaded!"
          $GITHUB_WORKSPACE/toolchain/clang/bin/clang --version

      - name: 🔗 Setup KernelSU & Symlink
        run: |
          echo "Downloading ReSukiSU..."
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash

          echo "Creating correct symlink..."
          ln -sfn ../KernelSU/kernel drivers/kernelsu

          if ! grep -q "drivers/kernelsu" drivers/Makefile; then
            echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          fi

          if ! grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig; then
            sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          fi
          echo "✅ KernelSU Symlink fixed!"

      - name: 🩹 Fix Stack Protector Error
        run: |
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/g' arch/arm64/configs/camellia_defconfig
          echo "CONFIG_CC_STACKPROTECTOR_NONE=y" >> arch/arm64/configs/camellia_defconfig

          sed -i 's/ifdef CONFIG_CC_STACKPROTECTOR_REGULAR/ifdef DISABLED_SP_REGULAR/' Makefile
          sed -i 's/ifdef CONFIG_CC_STACKPROTECTOR_STRONG/ifdef DISABLED_SP_STRONG/' Makefile
          sed -i '/^ifdef CONFIG_CC_STACKPROTECTOR$/s/.*/ifdef DISABLED_SP/' Makefile
          sed -i 's/ifdef stackp-name/ifdef DISABLED_STACKP_NAME/' Makefile
          sed -i 's/ifdef stackp-check/ifdef DISABLED_STACKP_CHECK/' Makefile
          echo "✅ Stack Protector Error fixed!"

      - name: 🩹 Apply Manual Hooks (Non-GKI 4.14)
        run: |
          set -e

          echo "=== 1. Updating defconfig ==="
          DEFCONFIG="arch/arm64/configs/camellia_defconfig"
          sed -i '/CONFIG_KSU/d' "$DEFCONFIG"
          {
            echo ""
            echo "# --- BakaSU Manual Hook (Non-GKI 4.14) ---"
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_MANUAL_HOOK=y"
            echo "# CONFIG_KSU_TRACEPOINT_HOOK is not set"
            echo "CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK=y"
            echo "CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK=y"
          } >> "$DEFCONFIG"
          echo "✅ Defconfig updated"

          echo "=== 2. Patching kernel source ==="
          python3 - <<'PYEOF'
          import sys

          def do_patch(path, old, new, label, required=True):
              c = open(path).read()
              if new in c:
                  print("  OK %s: already patched" % label)
                  return
              if old not in c:
                  if required:
                      print("  FAIL %s: PATTERN NOT FOUND" % label)
                      sys.exit(1)
                  print("  SKIP %s: pattern not found" % label)
                  return
              c = c.replace(old, new, 1)
              open(path, "w").write(c)
              print("  OK %s: patched" % label)

          def add_externs(path, anchor, lines, label):
              c = open(path).read()
              if lines[0] in c:
                  print("  OK %s: externs already present" % label)
                  return
              if anchor not in c:
                  print("  FAIL %s: anchor not found" % label)
                  sys.exit(1)
              c = c.replace(anchor, "\n".join(lines) + "\n\n" + anchor, 1)
              open(path, "w").write(c)
              print("  OK %s: externs inserted" % label)

          # ---------- fs/exec.c ----------
          print("[fs/exec.c]")
          add_externs("fs/exec.c", "static int do_execveat_common(int fd,",
              ["#ifdef CONFIG_KSU_MANUAL_HOOK",
               "extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);",
               "extern int ksu_handle_post_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags, int *retval);",
               "#endif"],
              "exec.c externs")

          old = "return __do_execve_file(fd, filename, argv, envp, flags, NULL);"
          new = ("#ifdef CONFIG_KSU_MANUAL_HOOK\n"
                 "\tint retval;\n"
                 "\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n"
                 "\tretval = __do_execve_file(fd, filename, argv, envp, flags, NULL);\n"
                 "\tksu_handle_post_execveat(&fd, &filename, &argv, &envp, &flags, &retval);\n"
                 "\treturn retval;\n"
                 "#else\n"
                 "\treturn __do_execve_file(fd, filename, argv, envp, flags, NULL);\n"
                 "#endif")
          do_patch("fs/exec.c", old, new, "exec.c body")

          # ---------- fs/open.c ----------
          print("[fs/open.c]")
          add_externs("fs/open.c", "SYSCALL_DEFINE3(faccessat,",
              ["#ifdef CONFIG_KSU_MANUAL_HOOK",
               "extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);",
               "#endif"],
              "open.c externs")

          old = "return do_faccessat(dfd, filename, mode);"
          new = ("#ifdef CONFIG_KSU_MANUAL_HOOK\n"
                 "\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n"
                 "#endif\n"
                 "\treturn do_faccessat(dfd, filename, mode);")
          do_patch("fs/open.c", old, new, "open.c body")

          # ---------- fs/stat.c ----------
          print("[fs/stat.c]")
          add_externs("fs/stat.c", "SYSCALL_DEFINE4(newfstatat,",
              ["#ifdef CONFIG_KSU_MANUAL_HOOK",
               "extern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);",
               "extern void ksu_handle_newfstat_ret(unsigned int *fd, struct stat __user **statbuf_ptr);",
               "#endif"],
              "stat.c externs")

          old = "error = vfs_fstatat(dfd, filename, &stat, flag);"
          new = ("#ifdef CONFIG_KSU_MANUAL_HOOK\n"
                 "\tksu_handle_stat(&dfd, &filename, &flag);\n"
                 "#endif\n"
                 "\terror = vfs_fstatat(dfd, filename, &stat, flag);")
          c = open("fs/stat.c").read()
          if new in c:
              print("  OK stat.c vfs_fstatat: already patched")
          elif old in c:
              c = c.replace(old, new)
              open("fs/stat.c", "w").write(c)
              print("  OK stat.c vfs_fstatat: patched")
          else:
              print("  FAIL stat.c vfs_fstatat: pattern not found")
              sys.exit(1)

          old = "error = cp_new_stat(&stat, statbuf);"
          new = ("error = cp_new_stat(&stat, statbuf);\n"
                 "#ifdef CONFIG_KSU_MANUAL_HOOK\n"
                 "\tksu_handle_newfstat_ret(&fd, &statbuf);\n"
                 "#endif")
          do_patch("fs/stat.c", old, new, "stat.c newfstat_ret")

          print()
          print("ALL PATCHES APPLIED")
          PYEOF

          echo
          echo "=== 3. Verify ==="
          echo "exec.c: $(grep -c 'ksu_handle_execveat' fs/exec.c) hook(s)"
          echo "open.c: $(grep -c 'ksu_handle_faccessat' fs/open.c) hook(s)"
          echo "stat.c: $(grep -c 'ksu_handle_stat' fs/stat.c) hook(s)"
          echo "✅ DONE"

      - name: 🚀 Compile Kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/toolchain/clang/bin:$GITHUB_WORKSPACE/toolchain/gcc-64/bin:$GITHUB_WORKSPACE/toolchain/gcc-32/bin:$PATH"

          KCFLAGS_FIX="-Wno-error=incompatible-pointer-types \
            -Wno-error=implicit-function-declaration \
            -Wno-error=int-conversion \
            -Wno-error=return-type \
            -Wno-error=macro-redefined \
            -Wno-error=array-bounds \
            -Wno-error=unused-variable \
            -Wno-error=address-of-packed-member \
            -Wno-unknown-warning-option"

          make O=out ARCH=arm64 camellia_defconfig

          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            KCFLAGS="$KCFLAGS_FIX"

      - name: 📦 Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git -b master anykernel
          cp out/arch/arm64/boot/Image.gz-dtb anykernel/
          cd anykernel
          zip -r ../AnyKernel3-camellia.zip . -x "*.git*"

      - name: ✏️ Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Camellia-Kernel-AnyKernel3
          path: AnyKernel3-camellia.zip
          retention-days: 7
