name: Build Kernel

on:
  workflow_dispatch:   # यह "Run workflow" बटन को सक्षम करता है

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-22.04
    steps:
      - name: Build
        uses: dabao1955/kernel_build_action@main
        with:
          # --- आपकी कर्नेल रिपॉज़िटरी की जानकारी ---
          # यहाँ अपनी रिपॉजिटरी और ब्रांच का नाम डालें जहाँ पैच किया हुआ कोड है
          kernel-url: https://github.com/Vikram5fbd009/Overclock_mt6833
          kernel-branch: backport-path_umount   # <-- आपकी ब्रांच जहाँ SUSFS, KSU आदि है
          config: camellia_defconfig            # <-- आपके डिवाइस का defconfig
          
          # --- आर्किटेक्चर और टूलचेन ---
          arch: arm64
          android-version: 12                   # <-- आपके डिवाइस का Android वर्ज़न
          aosp-clang-version: r383902           # 4.14 कर्नेल के लिए उपयुक्त Clang वर्ज़न
          
          # --- AnyKernel3 पैकेजिंग (यही आपकी समस्या का हल है) ---
          # इसे true करने से AnyKernel3 ज़िप बनेगी और bootimg-url की जरूरत नहीं पड़ेगी
          anykernel3: true
          
          # --- KernelSU ---
          # चूंकि आपके सोर्स में KSU पहले से है, इसे false रखें
          # ताकि एक्शन खुद से KSU को डाउनलोड न करे
          ksu: false
