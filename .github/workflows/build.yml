name: Build Kernel (Collect All Errors)

on:
  workflow_dispatch:

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: Vikram5fbd009/Overclock_mt6833
          ref: backport-path_umount
          path: kernel
          # 👇 submodules: recursive hata diya hai

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev \
            clang lld gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf \
            cpio python3 zip kmod device-tree-compiler

      - name: Compile with -k (collect ALL errors)
        working-directory: kernel
        run: |
          set +e
          
          make ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- O=out camellia_defconfig
          
          make ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- O=out -k -j$(nproc) 2>&1 | tee ../build.log
          
          BUILD_EXIT=${PIPESTATUS[0]}
          
          echo ""
          echo "==========================================="
          echo " ALL UNIQUE ERRORS (duplicates hata ke)"
          echo "==========================================="
          grep -E "error:" ../build.log | \
            sed -E 's/.*error: //' | \
            sort -u | \
            head -50
          echo "==========================================="
          
          ERROR_COUNT=$(grep -c "error:" ../build.log)
          echo "Total error lines: $ERROR_COUNT"
          echo "Unique error types: $(grep -E 'error:' ../build.log | sed -E 's/.*error: //' | sort -u | wc -l)"
          
          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo ""
            echo "::error::Build failed with $ERROR_COUNT errors. Check summary above."
            exit 1
          fi

      - name: Upload Full Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-full
          path: build.log
          retention-days: 7

      - name: Build AnyKernel3
        if: success()
        working-directory: kernel
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git -b master AnyKernel3
          cd AnyKernel3
          rm -rf .git .github README.md
          cp ../out/arch/arm64/boot/Image.gz-dtb .
          zip -r9 "../BakaSU-SUSFS-AnyKernel3.zip" * -x .git/*

      - name: Upload AnyKernel3 Zip
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-zip
          path: kernel/BakaSU-SUSFS-AnyKernel3.zip
