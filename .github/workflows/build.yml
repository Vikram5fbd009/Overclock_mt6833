name: Build Kernel (AnyKernel3)

on:
  workflow_dispatch:

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-22.04
    steps:
      - name: Build
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/Vikram5fbd009/Overclock_mt6833
          kernel-branch: backport-path_umount 
          config: camellia_defconfig
          arch: arm64
          android-version: 12
          aosp-clang-version: r383902
          
          # 👇 AnyKernel3 ko Enable kiya (Zip banega)
          anykernel3: true
          
          # MTK 4.14 ke liye zaroori image naam
          anykernel3-args: "-k Image.gz-dtb"
          
          # 👇 KSU false hi rahega kyunki humara BakaSU source me pehle se hai
          ksu: false
